defaults:
  RPC_ETH: https://1rpc.io/eth
  ETHERSCAN_KEY:


blockchainExplorer:
  'hoodi':
      key: ${{ ETHERSCAN_KEY }}
      api: 'https://api.etherscan.io/v2/api?chainid=560048'
      www: 'https://etherscan.io'

  'eth':
      key: ${{ ETHERSCAN_KEY }}
      api: 'https://api.etherscan.io/v2/api?chainid=1'
      www: 'https://etherscan.io'

  'plasma':
      key: ${{ ETHERSCAN_KEY }}
      api: 'https://api.etherscan.io/v2/api?chainid=9745'
      www: 'https://plasmascan.to'

  'monad':
      key: ${{ ETHERSCAN_KEY }}
      api: 'https://api.etherscan.io/v2/api?chainid=143'
      www: 'https://monadscan.com'

  'mantle':
      key: ${{ ETHERSCAN_KEY }}
      api: 'https://api.etherscan.io/v2/api?chainid=5000'
      www: 'https://mantlescan.xyz/'


web3:
  'hoodi':
    chainId: 560048
    chainToken: 'ETH'
    endpoints:
      - url: 'https://0xrpc.io/hoodi'

  'eth':
    chainId: 1
    chainToken: 'ETH'
    endpoints:
      - url: ${{ RPC_ETH }}
        blockRangeLimit: 100000

  'mantle':
    chainId: 5000
    chainToken: 'MNT'
    endpoints:
      - url: ${{ RPC_MANTLE }}
        blockRangeLimit: 100000


